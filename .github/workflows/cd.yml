name: CD
on:
  workflow_call:

jobs:
    deploy:
        runs-on: self-hosted
        steps: 
            - name: Code Clone
              uses: actions/checkout@v7

            - name: Copy Env 
              run: cp .env.example .env

            - name: Docker Setup [Login]
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Deploy with Docker Compose
              run: |
                docker compose pull
                docker compose up -d
