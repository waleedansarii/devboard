name: CI
on: 
    workflow_dispatch:
        branches: [master]

jobs:
    code-format:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                go: ['1.22','1.23','1.24']
        steps:            
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                go-version: ${{ matrix.go }}
                go-version-file: 'backend/go.mod'
                cache-dependency-path: backend/go.sum   
            
            - name: Run Go Formatter
              run: go fmt
              working-directory: backend

            - name: Run Go Vet
              run: go vet
              working-directory: backend
            
            - name: Run Tests
              run: go test 
              working-directory: backend
